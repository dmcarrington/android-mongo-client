name: Release Build

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from version.properties
        id: version
        run: |
          VERSION_NAME=$(grep '^versionName=' version.properties | cut -d= -f2)
          VERSION_CODE=$(grep '^versionCode=' version.properties | cut -d= -f2)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION_NAME (code: $VERSION_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MONGO_CLIENT_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Build release APK
        env:
          MONGO_CLIENT_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          MONGO_CLIENT_KEYSTORE_PASSWORD: ${{ secrets.MONGO_CLIENT_KEYSTORE_PASSWORD }}
          MONGO_CLIENT_KEY_ALIAS: ${{ secrets.MONGO_CLIENT_KEY_ALIAS }}
          MONGO_CLIENT_KEY_PASSWORD: ${{ secrets.MONGO_CLIENT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Release v${{ steps.version.outputs.version_name }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
